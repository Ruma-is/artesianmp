<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#926829"/>
  
  <!-- Rural Connection Symbol - Handshake + Village -->
  <g transform="translate(256, 256)">
    <!-- House/Village Icon -->
    <path d="M-80,-80 L-80,40 L-140,40 L-140,-40 L-100,-80 Z" fill="#faf8f5" stroke="#926829" stroke-width="3"/>
    <rect x="-130" y="-20" width="20" height="30" fill="#926829"/>
    <rect x="-110" y="-40" width="20" height="20" fill="#926829"/>
    
    <!-- Handshake Symbol -->
    <g transform="translate(60, 0)">
      <ellipse cx="0" cy="0" rx="50" ry="40" fill="#faf8f5" stroke="#926829" stroke-width="3"/>
      <path d="M-30,-10 Q-20,-20 0,-15 Q20,-20 30,-10" stroke="#926829" stroke-width="4" fill="none"/>
      <path d="M-30,10 Q-20,20 0,15 Q20,20 30,10" stroke="#926829" stroke-width="4" fill="none"/>
      <circle cx="-25" cy="-5" r="3" fill="#926829"/>
      <circle cx="25" cy="-5" r="3" fill="#926829"/>
    </g>
    
    <!-- Connection Lines -->
    <path d="M-40,0 L20,0" stroke="#faf8f5" stroke-width="4" stroke-dasharray="8,4"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#faf8f5" text-anchor="middle">RC</text>
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="20" fill="#faf8f5" text-anchor="middle" opacity="0.9">Rural Connection</text>
</svg>